<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Audio Recorder</title>
    <link rel="stylesheet" href="/static/style.css?v=3">
</head>
<body>
    <h2>WebRTC Audio Recorder</h2>

    <fieldset>
        <legend>Controls</legend>
        <button id="startBtn">Start Recording</button>
        <button id="stopBtn" disabled>Stop Recording</button>
    </fieldset>

    <fieldset>
        <legend>State</legend>
        <div><strong>Status:</strong> <span id="statusDot">●</span> <span id="statusText">Ready</span></div>
        <div><strong>Timer:</strong> <span id="timer">00:00</span></div>
        <div>
            <strong>Audio Level:</strong>
            <span class="meter-bar">
                <span class="meter-fill" id="meterFill"></span>
            </span>
        </div>
        <div id="message" class="hidden"></div>
    </fieldset>

    <fieldset>
        <legend>Debug Log</legend>
        <pre id="debugLog"></pre>
    </fieldset>

    <script src="/static/app.js?v=3"></script>
</body>
</html>
