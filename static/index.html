<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Audio Recorder</title>
    <link rel="stylesheet" href="/static/style.css?v=7">
</head>
<body>
    <h2>WebRTC Audio Recorder</h2>

    <fieldset>
        <legend>Controls</legend>
        <button id="startBtn">Start Recording</button>
        <button id="stopBtn" disabled>Stop Recording</button>
    </fieldset>

    <fieldset>
        <legend>Live Stream Link</legend>
        <div>Share this link so others can listen directly in their browser:</div>
        <div class="share-box">
            <input type="text" id="shareUrl" class="share-input" readonly>
            <button id="copyBtn" type="button">Copy Link</button>
            <a id="openLink" href="/stream" target="_blank"><button type="button">Open Browser Player</button></a>
        </div>
    </fieldset>

    <fieldset>
        <legend>State</legend>
        <div><strong>Status:</strong> <span id="statusDot">●</span> <span id="statusText">Ready</span></div>
        <div><strong>Timer:</strong> <span id="timer">00:00</span></div>
        <div>
            <strong>Audio Level:</strong>
            <span class="meter-bar">
                <span class="meter-fill" id="meterFill"></span>
            </span>
        </div>
        <div id="message" class="hidden"></div>
    </fieldset>

    <fieldset>
        <legend>Debug Log</legend>
        <pre id="debugLog"></pre>
    </fieldset>

    <script src="/static/lame.min.js"></script>
    <script src="/static/app.js?v=7"></script>
</body>
</html>
